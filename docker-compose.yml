services:
  app:
    build: .
    container_name: novamed-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://novamed:${POSTGRES_PASSWORD}@db:5432/novamed_db
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Migraciones + triggers de inmutabilidad + seed (idempotente); corre y termina.
  migrate:
    build:
      context: .
      target: builder
    container_name: novamed-migrate
    command: >
      sh -c "npx prisma migrate deploy
      && npx prisma db execute --schema prisma/schema.prisma --file prisma/immutability.sql
      && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://novamed:${POSTGRES_PASSWORD}@db:5432/novamed_db
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: novamed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: novamed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: novamed_db
    volumes:
      - novamed-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novamed -d novamed_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  novamed-pgdata:
  uploads:
